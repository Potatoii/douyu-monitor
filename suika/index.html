<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>水果合成 · 斗鱼版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #1f2a3a; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
    touch-action: none; cursor: crosshair; user-select: none; }
  .ui { position: absolute; left: 14px; right: 14px; pointer-events: none; }
  #overlay { position: absolute; inset: 0; background: rgba(15,20,30,.62); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    z-index: 10; cursor: pointer; text-align: center; padding: 20px; }
  #title { font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  #sub { margin-top: 12px; color: #d7e2f0; font-size: 14px; line-height: 1.8; opacity: .95; }
  #final { font-size: 18px; font-weight: 700; color: #ffd166; margin-top: 8px; }
  #flash { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font-size: 30px;
    font-weight: 900; color: #fff; text-shadow: 0 0 16px rgba(0,0,0,.6); opacity: 0; z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="ui" id="top"></div>
  <div id="flash"></div>
  <div id="overlay">
    <div id="title">合成大西瓜</div>
    <div id="sub">点击 / 空格 投掷 · 鼠标左右移动预览<br>同种水果相碰合成升级<br>目标：合成两颗大西瓜</div>
    <div id="final"></div>
  </div>
</div>
<script src="matter.min.js"></script>
<script>
(function () {
  // ---- 斗鱼视觉/物理规格 (make-watermelon-master) ----
  // play area: width 690, top +500, bottom -540 (1pt = 1px at scale 1)
  const W = 690, H = 1040;
  const DANGER_Y = 310;   // douyu dangerY
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const flashEl = document.getElementById('flash');
  const overlayEl = document.getElementById('overlay');
  const finalEl = document.getElementById('final');

  let sizeScale = 1;
  function fit() {
    const m = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
    sizeScale = m;
    canvas.style.width = (W * m) + 'px';
    canvas.style.height = (H * m) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);

  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);

// 斗鱼水果表 (level, name, radius, douyu color)
  const TIER_DATA = [
    { name: 'Blueberry',  r: 26, color: '#3e62b1' },
    { name: 'Orange',     r: 41, color: '#faa618' },
    { name: 'Lime',       r: 54, color: '#a0cd58' },
    { name: 'DragonFruit',r: 60, color: '#e4183f' },
    { name: 'Kiwi',       r: 76, color: '#adc547' },
    { name: 'Apple',      r: 92, color: '#c5202b' },
    { name: 'Peach',      r: 97, color: '#f98d73' },
    { name: 'Pineapple',  r: 129, color: '#f8c430' },
    { name: 'Coconut',    r: 154, color: '#7b442b' },
    { name: 'HalfWatermelon', r: 164, color: '#ea5c3b' },
    { name: 'Watermelon', r: 170, color: '#518935' }
  ];
  const MAX_TIER = TIER_DATA.length - 1;

  // load fruit png textures (fruits/fruit_N.png, N = tier+1)
  const textures = [];
  let texLoaded = 0;
  const texTotal = TIER_DATA.length;
  function loadTextures(done) {
    for (let i = 0; i < TIER_DATA.length; i++) {
      textures[i] = new Image();
      textures[i].onload = () => { texLoaded++; if (texLoaded >= texTotal) done(); };
      textures[i].onerror = () => { texLoaded++; if (texLoaded >= texTotal) done(); };
      textures[i].src = 'fruits/fruit_' + (i + 1) + '.png';
    }
  }

  let engine, fruits;
  let state = 'menu';            // menu | play | over
  let dangerStart = -1;
  let nextTier = 0;
  let particles = [];
  let shake = 0;
  let last = performance.now();
  let acc = 0;
  let spawnTime = 0;
  let dropCount = 0;
  let nextDropAt = 0;        // 下一次允许投掷的时间 (douyu: lastDropAt 间隔 0.45s)
  let activePointerId = null;
  let previewX = W / 2;      // 待投果的悬停 x (douyu currentFruit 位置, 初始居中)
  let slide = null;          // 点击投掷时的横滑动效 {from,to,t0,dur}
  let trailReset = 0;
  let droppingFruit = null;  // douyu droppingFruitId: 正在下落未入睡的果

  // 投掷上限随已投数量渐开: 分段照抄 douyu wasm 核心 normalStartUpperExclusive 实测表。
  //   核心表: d<4 ->2, d<9 ->3, d<18 ->4, d>=18 ->5。斗鱼正常模式(对战)更高级水果
  //   由服务端 stageFruitList 下发(本地无服务端), 故兜底离线把上限再抬到苹果(6)。
  // 数字7-11/Pineapple 与之不相上下的绝不掉落, 只靠合成。
  function startUpper(dropCount) {
    const n = dropCount;
    if (n < 4) return 2;
    if (n < 9) return 3;
    if (n < 18) return 4;
    if (n < 30) return 5;
    return 6;
  }
  // douyu randomStartLevel: 池内加权采样, 越小的果概率越大; dropCount 只决定池大小不决定具体果
  function randTier() {
    const up = Math.min(startUpper(dropCount), 6); // 上限封顶苹果 (离线无服务端下发, 苹果=最高可掉)
    const weights = new Array(up);
    let total = 0;
    for (let i = 0; i < up; i++) { weights[i] = up - i; total += weights[i]; }
    let r = Math.random() * total;
    for (let i = 0; i < up; i++) { r -= weights[i]; if (r < 0) return i; }
    return 0;
  }

  function reset() {
    dropCount = 0;
    engine = Matter.Engine.create({ enableSleeping: true });
    // douyu gravity=(0,-1300px/s²) 换算到 Matter (600px自由落体 0.95s 等价)
    engine.gravity.y = 1.6;
    // douyu: fixedTimeStep 1/120, maxSubSteps 2, velIter 18, posIter 24
    engine.positionIterations = 24;
    engine.velocityIterations = 18;
    engine.constraintIterations = 3;
    const wallOpts = { isStatic: true, friction: 0.2, frictionStatic: 0.2, restitution: 0.1 };
    Matter.Composite.add(engine.world, [
      Matter.Bodies.rectangle(-40, H / 2, 80, H * 3, wallOpts),
      Matter.Bodies.rectangle(W + 40, H / 2, 80, H * 3, wallOpts),
      Matter.Bodies.rectangle(W / 2, H + 60, W * 3, 120, wallOpts)
    ]);
    Matter.Events.on(engine, 'collisionStart', handleCollision);
    fruits = [];
    particles = [];
    wheel();
    previewX = W / 2;
    slide = null;
    nextDropAt = 0;
    activePointerId = null;
    dangerStart = -1;
    droppingFruit = null;
    spawnTime = performance.now() - 900;
  }

  // ---- physics body (全参数照抄斗鱼 Cocos Box2D)
  //   createFruit: restitution .1(抽奖 .05), friction .2, density getFruitDensity()=1, allowSleep。
  //   Box2D 无 air/angular 阻尼, 碰撞弹性混合取 max(a,b): 果果=.1, 果vs墙(.1)=.1。
  function addBody(tier, x, y, vx, vy) {
    const t = TIER_DATA[tier];
    const b = Matter.Bodies.circle(x, y, t.r, {
      friction: 0.2, frictionStatic: 0.2, restitution: 0.1,
      density: 1, allowSleep: true, sleepThreshold: 20,
      // Box2D 无阻尼: frictionAir/angularDamping 保持 0(默认)不设
      collisionFilter: { group: tier + 1 }
    }, 16); // 16边: 与Box2D真圆一致,落地角=0 (默认25边会自转48°找稳定点)
    b.fruitTier = tier;
    b.spawnAt = performance.now();
    Matter.Body.setVelocity(b, { x: vx || 0, y: vy || 0 });
    Matter.Composite.add(engine.world, b);
    fruits.push(b);
    return b;
  }

  function spawnFruit(x) {
    x = clampX(x);
    // douyu: 出生静止 (0,0), 由一个 dropY=playTop+radius 的顶缘开始自由落体。
    // 无随机横初速 -> 不再有"平移"。
    const b = addBody(nextTier, x, TIER_DATA[nextTier].r, 0, 0);
    b.spawnAt = performance.now();
    droppingFruit = b;                       // douyu droppingFruitId: 本果正在下落
    dropCount += 1;                          // douyu finishCurrentFruitDrop: dropCount+=1 (解锁渐开)
    wheel();
    dangerStart = -1;
    spawnTime = performance.now();
    previewX = x;                            // 新待投果从落点继续悬
    return b;
  }

  function clampX(x) {
    // douyu getDropXFromTouch: clamp 到 ±(playWidth/2 - radius)
    return Math.max(TIER_DATA[nextTier].r, Math.min(W - TIER_DATA[nextTier].r, x));
  }

  // douyu: droppingFruitId (正在下落的果) 不参与危险区判定
  // hasDroppedFruitInDangerZone: 果顶 (douyu y向上 y+radius) 越过 dangerY 才计危险。
  // 本地 y向下, 果顶 = y - radius, 越过 = y - radius < DANGER_Y
  // 对齐斗鱼 hasFruitAboveDangerLine: 仅当果已静止(速度<40)才算危险, 下落中的不算;
  // 否则睡果卡顶会导致 canDrop 永久 false (投掷死锁, 永远做不了大西瓜)
  function hasDroppedFruitInDangerZone() {
    const now = performance.now();
    for (const b of fruits) {
      if (b.removed) continue;
      if (b === droppingFruit) continue;            // 除了正在下落那颗, 完全豁免 (douyu droppingFruitId)
      if (b.position.y - b.circleRadius >= DANGER_Y) continue;  // 顶未越线
      if (now - (b.spawnAt || 0) < 300) continue;   // 出生未满 0.3s 不算危险
      const vx = Math.abs(b.velocity.x), vy = Math.abs(b.velocity.y);
      if (vx >= 40 || vy >= 40) continue;           // 仍运动不算危险
      return true;
    }
    return false;
  }

  function canDrop() {
    // douyu: nextDropAllowedAt 冷却 + slide 是唯一硬门; hasFruitAboveDangerLine 只是 UI 提示,
    // 人类玩家在危险提示下仍可投掷 (孤岛小果会睡在危险区形成一个永久锁, 硬门会让大西瓜永远做不出来)
    if (state !== 'play' || slide) return false;
    return performance.now() >= nextDropAt;
  }

  // douyu dropCurrentFruitAt: 松手先把当前球从原位横滑到目标点再落。
  function startSlide(from, to) {
    from = clampX(from);
    to = clampX(to);
    const dist = Math.abs(to - from);
    nextDropAt = performance.now() + 450;   // douyu: 投掷间隔 0.45s
    if (dist < 1) { spawnFruit(to); return; }
    let dur = dist / 1200;                   // douyu 滑行速度 (r/1200)
    dur = Math.max(0.12, Math.min(0.22, dur)); // 夹在 0.12..0.22s
    slide = { from, to, t0: performance.now(), dur: dur * 1000 };
    updateSlide();                           // 立即播一帧 (生成尾迹)
  }

  function updateSlide() {
    if (!slide) return;
    const p = Math.min(1, (performance.now() - slide.t0) / slide.dur);
    const to = slide.to;
    if (p >= 1) { slide = null; spawnFruit(to); return; }
    previewX = slide.from + (to - slide.from) * p;
    trailAt(previewX);
  }

  function trailAt(tx) {
    // douyu createReadyFruitMoveTrail: 沿滑行路径每隔一格留淡出残影
    const tier = nextTier;
    if (!trailReset || performance.now() - trailReset > 26) {
      trailReset = performance.now();
      particles.push({
        x: tx, y: TIER_DATA[tier].r, vx: 0, vy: 0, life: 0.4,
        decay: 0.04, size: TIER_DATA[tier].r, color: TIER_DATA[tier].color, ghost: true
      });
    }
  }

  function removeBody(b) {
    b.removed = true;
    Matter.Composite.remove(engine.world, b);
    fruits = fruits.filter(f => f !== b);
  }

  // ---- merge (douyu twin-fruit logic)
  function handleCollision(ev) {
    for (const pair of ev.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      if (a === b || a.removed || b.removed) continue;
      const ta = a.fruitTier, tb = b.fruitTier;
      if (ta == null || ta !== tb) continue;
      mergePair(a, b);
    }
  }

  function mergePair(a, b) {
    if (a.merging || b.merging) return;
    const tier = a.fruitTier;
    // douyu mergeFruits: pick the deeper (larger y) fruit, new fruit spawns there
    // with ZERO linear velocity.
    const deeper = a.position.y >= b.position.y ? a : b;
    const ax = deeper.position.x;
    const ay = deeper.position.y;
    const jx = Math.max(-2, Math.min(2, (Math.random() - 0.5) * 6));
    const nx = ax + jx, ny = ay;
    a.merging = b.merging = true;
    removeBody(a); removeBody(b);

    if (tier >= MAX_TIER) {
      // 两颗最高级 -> 直接计分 + 消除 (douyu: 大西瓜合并即谢幕)
      burst(nx, ny, 90);
      shake = Math.max(shake, 20);
      showFlash('大西瓜!!');
      return;
    }
    const nt = tier + 1;
    const nb = addBody(nt, nx, ny, 0, 0);
    // douyu: 新果继承较深果 20% 角速度, 保持合并后滚动连贯
    Matter.Body.setAngularVelocity(nb, 0.2 * deeper.angularVelocity);
    // douyu: m.body.wakeUp() — 合并后唤醒附近果, 避免上层果睡眠悬空不塌
    for (const c of fruits) {
      if (c === nb) continue;
      const rr = TIER_DATA[nt].r + TIER_DATA[c.fruitTier].r + 8;
      const dx = c.position.x - nb.position.x, dy = c.position.y - nb.position.y;
      if (dx * dx + dy * dy < rr * rr) Matter.Sleeping.set(c, false);
    }
    Matter.Sleeping.set(nb, false);
    burst(nx, ny, 12 + tier * 3);
    if (nt === MAX_TIER) showFlash('大西瓜!');
    window.setTimeout(() => tryChain(nb, nt), 0);
  }

  function tryChain(body, tier) {
    const rr = TIER_DATA[tier].r * 2 + 8;   // douyu: rA + rB + 8
    for (const c of fruits) {
      if (c === body || c.fruitTier !== tier) continue;
      const dx = c.position.x - body.position.x, dy = c.position.y - body.position.y;
      if (dx * dx + dy * dy < rr * rr) {
        mergePair(c, body); return;
      }
    }
  }

  function checkMerges() {
    for (let i = 0; i < fruits.length; i++) {
      const a = fruits[i];
      if (!a) continue;
      const ra = TIER_DATA[a.fruitTier].r;
      for (let j = i + 1; j < fruits.length; j++) {
        const b = fruits[j];
        if (b.fruitTier !== a.fruitTier) continue;
        const rb = TIER_DATA[b.fruitTier].r;
        // douyu isWithinMergeProximity: dist < rA + rB + 8
        const rr = ra + rb + 8;
        const dx = a.position.x - b.position.x, dy = a.position.y - b.position.y;
        if (dx * dx + dy * dy < rr * rr) { mergePair(a, b); i = fruits.length; break; }
      }
    }
  }

  // douyu hasFruitAboveDangerLine: 需要水果已落定、非合并、出生>=0.8s(约)且近静止(速度<40)
  function checkGameOver() {
    const now = performance.now();
    for (const b of fruits) {
      // 果顶越过 dangerY 才计危险 (douyu: lineH = y + radius > dangerY)
      if (b.position.y - b.circleRadius < DANGER_Y) {
        if (now - (b.spawnAt || 0) < 800) continue;   // douyu bornAt>=0.8s
        const vx = Math.abs(b.velocity.x), vy = Math.abs(b.velocity.y);
        if (vx >= 40 || vy >= 40) continue;           // 未停稳不算
        if (dangerStart < 0) dangerStart = now;
        if (now - dangerStart > 800) { gameOver(); return; }
        continue;
      }
      dangerStart = -1;
    }
  }

  function gameOver() {
    state = 'over';
    finalEl.textContent = '游戏结束 · 点击再来一局';
    overlayEl.style.display = 'flex';
  }

  function startGame() {
    reset();
    state = 'play';
    overlayEl.style.display = 'none';
    finalEl.textContent = '';
    spawnTime = performance.now() - 900;
  }

  // ---- FX
  function burst(x, y) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 1.5 + Math.random() * 3;
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1, decay: 0.02 + Math.random() * 0.03, size: 2 + Math.random() * 4, color: '#ffe08a'
      });
    }
  }

  function showFlash(text) {
    flashEl.textContent = text;
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '1';
    requestAnimationFrame(() => {
      flashEl.style.transition = 'opacity .8s';
      flashEl.style.opacity = '0';
    });
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.18;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---- loop (douyu 120Hz: two 8.33ms Box2D steps per render frame)
  function step() {
    Matter.Engine.update(engine, 8.333);
    Matter.Engine.update(engine, 8.333);
    if (state === 'play') {
      updateSlide();
      checkMerges();
      checkGameOver();
    }
    updateParticles();
  }

  function wheel() { nextTier = randTier(); }

  // ---- render
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00000033';
    // 场景底
    ctx.fillStyle = '#24334a';
    ctx.fillRect(0, 0, W, H);
    ctx.shadowBlur = 0;

    // 危险线
    ctx.fillStyle = 'rgba(255,80,80,.16)';
    ctx.fillRect(0, DANGER_Y, W, 3);

    if (state === 'play') {
      // douyu currentFruit 悬停在 dropY = playTop + radius (顶缘)
      drawFruitPreview(nextTier, previewX, TIER_DATA[nextTier].r);
    }

    for (const b of fruits) drawBody(b);

    for (const p of particles) {
      if (p.ghost) {
        // douyu createReadyFruitMoveTrail: 残影用同款水果贴图淡出
        const img = textures[nextTier];
        const s = p.size;
        ctx.globalAlpha = Math.max(0, p.life) * 0.35;
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, p.x - s, p.y - s, s * 2, s * 2);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI * 2); ctx.fill();
        }
      } else {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.5, p.size * p.life), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawBody(b) {
    const img = textures[b.fruitTier];
    const r = TIER_DATA[b.fruitTier].r;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    // douyu: 物理旋转(eulerAngles.z = body.angle) -> 碰撞后水果滚动有转向
    ctx.rotate(b.angle);
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, -r, -r, r * 2, r * 2);
    } else {
      ctx.fillStyle = TIER_DATA[b.fruitTier].color;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawFruitPreview(tier, x, y) {
    const img = textures[tier];
    const r = TIER_DATA[tier].r;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.globalAlpha = .4;
      ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = TIER_DATA[tier].color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function loop(now) {
    const dt = Math.min(now - last, 50); last = now;
    acc += dt;
    while (acc >= 16.67) { step(); acc -= 16.67; }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- input
  function localX(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX || 0) - rect.left;
    return Math.max(0, Math.min(W, cx / sizeScale));
  }

  // ---- input (douyu touch model)
  // TOUCH_START -> activate drag (no drop). TOUCH_MOVE -> fruit follows finger.
  // TOUCH_END -> startSlide: 球先横滑到手指位置再落下 (滚动动画)。
  // 冷却 0.45s (nextDropAt) 拦截连点; slide 期间禁止再投。
  function canStartDropTouch(e) {
    if (!canDrop()) return false;
    if (slide) return false;
    let p = e.pointerId;
    if (p == null) p = 0;
    activePointerId = p;
    return true;
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    canStartDropTouch(e);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (state !== 'play') return;
    if (e.pointerId !== activePointerId) return;
    previewX = clampX(localX(e));            // 拖动跟随手指
  });
  canvas.addEventListener('pointerup', (e) => {
    if (state !== 'play') return;
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    // douyu onTouchEnd: isActiveDropTouch -> dropCurrentFruitAt (带横滑)
    startSlide(previewX, clampX(localX(e)));
  });
  canvas.addEventListener('pointercancel', () => { activePointerId = null; });
  canvas.addEventListener('pointerleave', () => { activePointerId = null; });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') previewX = clampX(previewX - 24);
    if (e.code === 'ArrowRight') previewX = clampX(previewX + 24);
    if (e.code === 'Space') {
      e.preventDefault();
      if (canDrop() && !slide) startSlide(previewX, previewX);
    }
  });

  overlayEl.addEventListener('click', () => { startGame(); });

  // ---- boot
  loadTextures(() => {
    reset();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
